<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird simple</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(to bottom, #70c5ce 0%, #4ca1af 100%);
      font-family: Arial, sans-serif;
      color: #fff;
    }
    canvas {
      border: 4px solid #333;
      border-radius: 12px;
      background: #70c5ce;
      box-shadow: 0 12px 24px rgba(0,0,0,0.2);
    }
    #info {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      width: 100%;
      pointer-events: none;
    }
    #message {
      margin-top: 8px;
      font-size: 1rem;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <div id="info">
    <div id="score">Puntaje: 0</div>
    <div id="message">Presiona espacio o clic para volar</div>
  </div>
  <canvas id="gameCanvas" width="420" height="600"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const messageEl = document.getElementById('message');

    const width = canvas.width;
    const height = canvas.height;

    const bird = {
      x: 80,
      y: height / 2,
      radius: 16,
      velocity: 0,
      gravity: 0.6,
      lift: -11,
      color: '#ffdd57'
    };

    const pipeWidth = 60;
    const pipeGap = 160;
    const pipeSpeed = 2.7;
    let pipes = [];
    let frame = 0;
    let score = 0;
    let running = false;
    let gameOver = false;

    function resetGame() {
      bird.y = height / 2;
      bird.velocity = 0;
      pipes = [];
      frame = 0;
      score = 0;
      running = true;
      gameOver = false;
      scoreEl.textContent = 'Puntaje: 0';
      messageEl.textContent = 'Presiona espacio o clic para volar';
      requestAnimationFrame(loop);
    }

    function addPipe() {
      const topHeight = Math.random() * (height - pipeGap - 120) + 50;
      pipes.push({ x: width, top: topHeight, bottom: topHeight + pipeGap, passed: false });
    }

    function drawBackground() {
      ctx.fillStyle = '#70c5ce';
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = '#b2e0ef';
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.ellipse(80 + i * 120, 110, 40, 26, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawBird() {
      ctx.fillStyle = bird.color;
      ctx.beginPath();
      ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.arc(bird.x + 8, bird.y - 4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff625b';
      ctx.fillRect(bird.x - 4, bird.y + 6, 18, 6);
    }

    function drawPipes() {
      ctx.fillStyle = '#4d9f4c';
      pipes.forEach(pipe => {
        ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
        ctx.fillRect(pipe.x, pipe.bottom, pipeWidth, height - pipe.bottom);
      });
    }

    function update() {
      bird.velocity += bird.gravity;
      bird.y += bird.velocity;
      if (bird.y + bird.radius > height) {
        bird.y = height - bird.radius;
        gameOver = true;
      }
      if (bird.y - bird.radius < 0) {
        bird.y = bird.radius;
        bird.velocity = 0;
      }

      pipes.forEach(pipe => {
        pipe.x -= pipeSpeed;
        if (!pipe.passed && pipe.x + pipeWidth < bird.x) {
          score += 1;
          pipe.passed = true;
          scoreEl.textContent = 'Puntaje: ' + score;
        }
      });

      pipes = pipes.filter(pipe => pipe.x + pipeWidth > -20);

      if (frame % 100 === 0) {
        addPipe();
      }

      pipes.forEach(pipe => {
        const hitTop = bird.x + bird.radius > pipe.x && bird.x - bird.radius < pipe.x + pipeWidth && bird.y - bird.radius < pipe.top;
        const hitBottom = bird.x + bird.radius > pipe.x && bird.x - bird.radius < pipe.x + pipeWidth && bird.y + bird.radius > pipe.bottom;
        if (hitTop || hitBottom) {
          gameOver = true;
        }
      });

      if (gameOver) {
        running = false;
        messageEl.textContent = 'Juego terminado. Haz clic para reiniciar.';
      }
    }

    function draw() {
      drawBackground();
      drawPipes();
      drawBird();
    }

    function loop() {
      if (!running) return;
      frame += 1;
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function flap() {
      if (!running) {
        resetGame();
      }
      bird.velocity = bird.lift;
    }

    window.addEventListener('keydown', event => {
      if (event.code === 'Space') {
        event.preventDefault();
        flap();
      }
    });

    canvas.addEventListener('mousedown', () => flap());
    canvas.addEventListener('touchstart', event => {
      event.preventDefault();
      flap();
    }, { passive: false });

    resetGame();
  </script>
</body>
</html>
